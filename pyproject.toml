[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cassette-fm"
version = "0.1.0"
description = "Radios continuas a partir de las carpetas de ~/Música"
requires-python = ">=3.12"
dependencies = ["mutagen", "websockets>=12", "dbus-fast>=2"]

[project.optional-dependencies]
dev = ["pytest", "aiohttp==3.14.5"]
dj = ["kokoro-onnx", "soundfile"]
piper = ["piper-tts"]

[project.scripts]
cassette = "cassette_fm.cli:main"
cassette-dj = "cassette_fm.dj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "relay/tests"]
pythonpath = ["relay", "tests"]
